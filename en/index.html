                "@type": "Question",
                "name": "What videos can I use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Swing videos recorded with sound, including the sound of the strike. Both portrait and landscape are supported. Videos can be up to 60 seconds long and 600 MB, in HD to 4K quality."
                }
              },
              {
                "@type": "Question",
                "name": "Can I use videos shot in landscape?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Landscape videos have been supported since version 1.2. You can analyze, edit, and save them just like portrait videos."
                }
              },
              {
                "@type": "Question",
                "name": "Does analysis need an internet connection?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Analysis runs entirely on your device. Your video is never uploaded to a server."
                }
              },
              {
                "@type": "Question",
                "name": "How much can I do for free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can use every feature, and your first 5 saves are free. A save is counted only when it succeeds."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work with shaky or zoomed-in videos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Camera shake and zoom are corrected automatically, so the trace sticks to the scenery. You can use videos shot handheld."
                }
              },
              {
                "@type": "Question",
                "name": "Will my HDR videos change color?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "HDR videos are saved with their colors intact. They won’t look washed out or faded."
                }
              },
              {
                "@type": "Question",
                "name": "Does the trace follow my shot shape (draw or fade)?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Choose your shot shape (Curves left or Curves right) the first time, and it’s applied to the first trace after analysis. You can adjust the curve and height in the editor at any time."
                }
              },
              {
                "@type": "Question",
                "name": "How do I cancel the subscription?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can cancel anytime in your App Store or Google Play subscription settings. On the App Store, canceling at least 24 hours before the end of the current period stops automatic renewal. On Google Play, you won’t be renewed or charged after you cancel."
                }
              }
            ]
